[env]
TERM = "xterm-256color"

[font]
size = 16.0

[font.normal]
family = "CaskaydiaCove Nerd Font"
style = "Regular"

[window]
decorations = "buttonless"

[window.dimensions]
columns = 120
lines = 35

[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"

[colors.normal]
black = "#484848"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"

[[colors.indexed_colors]]
index = 16
color = "#b65611"

[[colors.indexed_colors]]
index = 17
color = "#d43552"

[[colors.indexed_colors]]
index = 18
color = "#292824"

[[colors.indexed_colors]]
index = 19
color = "#6e6b5e"

[[colors.indexed_colors]]
index = 20
color = "#999580"

[[colors.indexed_colors]]
index = 21
color = "#e8e4cf"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Return"
mods = "Alt"
action = "ToggleFullscreen"
